<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E&M Software Blog - Interface Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }
        
        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .quick-actions {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #userInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        #sendBtn:hover {
            transform: scale(1.05);
        }
        
        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #999;
        }
        
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 E&M Software Blog Assistant</h1>
            <p>Posez vos questions sur le blog</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    👋 Bonjour ! Je suis votre assistant pour le blog E&M Software. 
                    Je peux vous aider à trouver des articles, chercher par mot-clé, 
                    ou vous donner des informations sur les auteurs.
                </div>
            </div>
        </div>
        
        <div class="quick-actions">
            <button class="quick-btn" onclick="quickAction('Combien d\'articles?')">📊 Nombre d'articles</button>
            <button class="quick-btn" onclick="quickAction('Liste les derniers articles')">📝 Derniers articles</button>
            <button class="quick-btn" onclick="quickAction('Qui sont les auteurs?')">👥 Auteurs</button>
            <button class="quick-btn" onclick="quickAction('Articles sur React')">🔍 Rechercher</button>
        </div>
        
        <div class="loading" id="loading">⏳ Chargement...</div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Posez votre question..."
                onkeypress="handleKeyPress(event)"
            >
            <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://brake-cubic-with-flashing.trycloudflare.com/api';
        
        function addMessage(content, isUser = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('active', show);
            document.getElementById('sendBtn').disabled = show;
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            showLoading(true);
            
            try {
                const response = await processQuery(message);
                addMessage(response);
            } catch (error) {
                addMessage('❌ Erreur: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        async function processQuery(query) {
            const lowerQuery = query.toLowerCase();
            
            // Compter les articles
            if (lowerQuery.includes('combien') || lowerQuery.includes('nombre')) {
                const data = await fetch(`${API_URL}/blog-posts`).then(r => r.json());
                return `📊 Le blog contient actuellement <strong>${data.data.length} articles</strong>.`;
            }
            
            // Lister les articles
            if (lowerQuery.includes('liste') || lowerQuery.includes('derniers')) {
                const data = await fetch(`${API_URL}/blog-posts?sort=publishedAt:desc&pagination[limit]=5&populate=*`).then(r => r.json());
                let response = '📝 <strong>Derniers articles :</strong><br><br>';
                data.data.forEach((article, i) => {
                    response += `${i + 1}. <strong>${article.title_fr}</strong><br>`;
                    response += `   📁 ${article.categoryLabel_fr} • ⏱️ ${article.readTime} min<br>`;
                    response += `   ✍️ ${article.author?.name || 'Auteur inconnu'}<br><br>`;
                });
                return response;
            }
            
            // Auteurs
            if (lowerQuery.includes('auteur')) {
                const data = await fetch(`${API_URL}/authors?populate=*`).then(r => r.json());
                let response = '👥 <strong>Auteurs du blog :</strong><br><br>';
                data.data.forEach(author => {
                    response += `• <strong>${author.name}</strong> - ${author.role}<br>`;
                    response += `  ${author.bio}<br><br>`;
                });
                return response;
            }
            
            // Recherche
            if (lowerQuery.includes('recherche') || lowerQuery.includes('articles sur')) {
                const keyword = query.split(/recherche|articles sur/i)[1]?.trim() || '';
                const data = await fetch(`${API_URL}/blog-posts?populate=*`).then(r => r.json());
                const results = data.data.filter(article => 
                    article.title_fr.toLowerCase().includes(keyword.toLowerCase()) ||
                    article.content_fr.toLowerCase().includes(keyword.toLowerCase())
                );
                
                if (results.length === 0) {
                    return `🔍 Aucun article trouvé pour "<strong>${keyword}</strong>".`;
                }
                
                let response = `🔍 <strong>${results.length} article(s) trouvé(s) pour "${keyword}" :</strong><br><br>`;
                results.forEach((article, i) => {
                    response += `${i + 1}. <strong>${article.title_fr}</strong><br>`;
                    response += `   ${article.excerpt_fr}<br><br>`;
                });
                return response;
            }
            
            // Réponse par défaut
            return `💡 Je peux vous aider avec :<br><br>
                    • "Combien d'articles ?" - Nombre total d'articles<br>
                    • "Liste les derniers articles" - Articles récents<br>
                    • "Qui sont les auteurs ?" - Liste des auteurs<br>
                    • "Articles sur React" - Recherche par mot-clé`;
        }
        
        function quickAction(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
